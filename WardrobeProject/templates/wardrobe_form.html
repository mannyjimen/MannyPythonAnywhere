<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Wardrobe!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2 class="subheader">Create a new wardrobe!</h2>

    <form method="POST">
        {{ form.hidden_tag() }}

        <p>
            {{ form.wardrobe_name.label }}
            {{ form.wardrobe_name(size=40) }}
        </p>

        <p>{{ form.submit() }}</p>
    </form>

</body>
</html>
